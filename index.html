<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Relative paths need a trailing slash when served as a sub-folder, e.g. /presentation/.
  if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<title>OM-Project_Presentation_HiLegal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="runtime/deck.css?v=11">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="bar-title"><button id="btnSidebarToggle" type="button" class="icon-button" title="Hide slide overview" aria-label="Hide slide overview" aria-expanded="true" aria-controls="slideSidebar"><img id="sidebarToggleIcon" src="assets/icons/chevron-left.svg" alt=""></button><img src="assets/hilegal-logo-white.png" alt="" class="bar-logo"><span id="deckTitle">Deck</span></div>
    <div class="bar-actions">
      <label class="version" title="Earlier versions of this slide from the GitHub history">Version
        <select id="version"><option value="">Current file</option></select>
      </label>
      <label class="live" title="Reload automatically when slide files change"><input type="checkbox" id="live" checked> Live reload</label>
      <button id="btnReload" type="button" title="Reload slides (R)">Reload</button>
      <a id="lnkPresenter" class="bar-link" href="presenter.html" target="_blank" rel="noopener" title="Notes, slide arrows and a shared timer for several devices">Presenter notes</a>
      <button id="btnPresent" type="button" class="primary" title="Present (P)">&#9654; Present</button>
    </div>
  </header>
  <aside class="sidebar" id="slideSidebar" aria-label="Slide navigation">
    <nav class="rail" id="rail" aria-label="Slides"></nav>
    <div class="rail-actions" aria-label="Chapter controls">
      <button id="btnExpandAll" type="button" aria-controls="rail">Expand all</button>
      <button id="btnCollapseAll" type="button" aria-controls="rail">Collapse all</button>
    </div>
  </aside>
  <main class="main" id="workspace">
    <div class="slide-area">
    <div class="stage" id="stage" title="Scroll here to change slides"></div>
    <div class="meta">
      <div class="meta-row">
        <span id="slideNo" class="slide-no"></span>
        <code id="slidePath"></code>
        <button id="btnCopy" type="button">Copy path</button>
        <span id="hiddenBadge" class="badge" hidden>Hidden in Present mode</span>
        <span id="versionBadge" class="badge old" hidden></span>
        <span id="status" class="status" role="status"></span>
        <div class="notes-tools" role="group" aria-label="Speaker notes layout">
          <span>Notes</span>
          <button id="btnNotesBottom" type="button" class="icon-button" title="Show notes below" aria-label="Show speaker notes below" aria-pressed="true" aria-controls="notesPanel"><img src="assets/icons/panel-bottom.svg" alt=""></button>
          <button id="btnNotesRight" type="button" class="icon-button" title="Show notes on the right" aria-label="Show speaker notes on the right" aria-pressed="false" aria-controls="notesPanel"><img src="assets/icons/panel-right.svg" alt=""></button>
          <button id="btnNotesToggle" type="button" class="icon-button" title="Hide notes (N)" aria-label="Hide speaker notes" aria-expanded="true" aria-controls="notesPanel"><img id="notesToggleIcon" src="assets/icons/chevron-down.svg" alt=""></button>
        </div>
      </div>
    </div>
    </div>
    <aside class="notes" id="notesPanel" aria-labelledby="notesHeading">
      <div class="notes-label" id="notesHeading">Speaker notes</div>
      <div id="notes" tabindex="0"></div>
    </aside>
  </main>
</div>
<div id="present" hidden>
  <div class="pstage" id="pstage"></div>
  <div class="pnotes" id="pnotes" hidden></div>
  <div class="pcount" id="pcount"></div>
</div>
<script src="runtime/sync.js?v=1"></script>
<script src="runtime/deck.js?v=12"></script>
</body>
</html>
