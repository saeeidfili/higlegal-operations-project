<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Relative paths need a trailing slash when served as a sub-folder, e.g. /presentation/.
  if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<title>OM-Project_Presentation_HiLegal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="runtime/deck.css?v=3">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="bar-title"><img src="assets/hilegal-logo-white.png" alt="" class="bar-logo"><span id="deckTitle">Deck</span></div>
    <div class="bar-actions">
      <label class="version" title="Earlier versions of this slide from the GitHub history">Version
        <select id="version"><option value="">Current file</option></select>
      </label>
      <button id="btnEdit" type="button" hidden title="Edit text and notes of this slide, saved to GitHub">&#9998; Edit</button>
      <button id="btnCancel" type="button" hidden>Cancel</button>
      <button id="btnSave" type="button" class="primary" hidden>Save to GitHub</button>
      <label class="live" title="Reload automatically when slide files change"><input type="checkbox" id="live" checked> Live reload</label>
      <button id="btnReload" type="button" title="Reload slides (R)">Reload</button>
      <button id="btnPresent" type="button" class="primary" title="Present (P)">&#9654; Present</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Slides"></nav>
  <main class="main">
    <div class="stage" id="stage"></div>
    <div class="meta">
      <div class="meta-row">
        <span id="slideNo" class="slide-no"></span>
        <code id="slidePath"></code>
        <button id="btnCopy" type="button">Copy path</button>
        <span id="hiddenBadge" class="badge" hidden>Hidden in Present mode</span>
        <span id="versionBadge" class="badge old" hidden></span>
        <button id="btnRestore" type="button" hidden title="Copy a request for your agent to restore this version">Copy restore request</button>
        <span id="status" class="status"></span>
      </div>
      <div class="notes">
        <div class="notes-label">Speaker notes</div>
        <div id="notes"></div>
      </div>
    </div>
  </main>
</div>
<dialog id="tokenDlg">
  <form method="dialog">
    <h3>Save to GitHub</h3>
    <p>Saving creates a commit on the <code>presentation</code> branch. You need write access to the repository and a GitHub token.</p>
    <ol>
      <li><a id="tokenLink" href="https://github.com/settings/tokens/new?scopes=public_repo&amp;description=HiLegal%20deck%20editor" target="_blank" rel="noopener">Create a classic token</a> with the scope <code>public_repo</code>.</li>
      <li>Paste it here. It stays in this browser only.</li>
    </ol>
    <input id="tokenInput" type="password" placeholder="ghp_…" autocomplete="off">
    <div class="dlg-actions">
      <button value="forget" type="submit" id="tokenForget">Forget saved token</button>
      <button value="cancel" type="submit">Cancel</button>
      <button value="ok" type="submit" class="primary">Save token and continue</button>
    </div>
  </form>
</dialog>
<div id="present" hidden>
  <div class="pstage" id="pstage"></div>
  <div class="pnotes" id="pnotes" hidden></div>
  <div class="pcount" id="pcount"></div>
</div>
<script src="runtime/deck.js?v=3"></script>
</body>
</html>
