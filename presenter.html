<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Presenter – HiLegal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
  :root { --bg: #0a0a0a; --panel: #161616; --line: #2a2a2a; --text: #f3f4f6; --muted: #99a1af; --accent: #d92605; --gold: #c9a86a; --ok: #3fae6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, Arial, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  button { font: inherit; cursor: pointer; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  a { color: var(--gold); }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 2px solid var(--gold); flex-wrap: wrap; }
  header img { height: 26px; }
  .h-title { font-weight: 700; margin-right: auto; }
  .room { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .room code { color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; letter-spacing: 1px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .dot.on { background: var(--ok); }
  .h-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 14px; text-decoration: none; }
  .ico { width: 18px; height: 18px; flex: none; }

  main { flex: 1; overflow-y: auto; padding: 16px; max-width: 980px; width: 100%; margin: 0 auto; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 10px; font-size: 24px; line-height: 1.25; }
  .plan { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; font-size: 14px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
  .chip b { color: var(--text); }
  .chip.behind { border-color: var(--accent); color: #ffb4a6; }
  .chip.ahead { border-color: var(--ok); color: #a6e3bd; }
  .notes { font-size: 19px; line-height: 1.55; white-space: normal; --n-accent: #C9A86A; --n-ink: #FFFFFF; --n-muted: #99A1AF; }
  .n-sec { margin: 0 0 18px; }
  .n-sec p { margin: 0 0 6px; }
  .n-label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--n-accent); }
  .n-sec ol, .n-sec ul { margin: 2px 0 6px; padding-left: 1.4em; }
  .n-sec li { margin: 6px 0; }
  .n-key-message p { font-weight: 600; color: var(--n-ink); }
  .n-quote { color: var(--n-ink); }
  .n-dir { color: var(--n-muted); }
  .n-transition p { color: var(--n-ink); font-style: italic; }
  .n-if-asked, .n-data, .n-sources { color: var(--n-muted); font-size: 16px; }
  b.n-inline { font-weight: 700; color: var(--n-ink); }
  .next { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }

  footer { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #0f0f0f; }
  .nav { height: 64px; display: flex; align-items: center; justify-content: center; }
  @media (max-width: 640px) {
    header { flex-wrap: nowrap; gap: 8px; padding: 6px 10px; }
    header img { height: 20px; }
    .h-title { display: none; }
    .room { margin-right: auto; font-size: 13px; }
    .room code { padding: 2px 6px; }
    .h-btn { padding: 7px; }
    .h-btn .lbl, .h-btn.proj { display: none; }
    .ico { width: 20px; height: 20px; }
  }
  .nav:active { background: #222; }
  .timer { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 150px; }
  .clock { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .clock.over { color: var(--accent); }
  .clock-sub { font-size: 12px; color: var(--muted); }
  .t-btns { display: flex; gap: 6px; }
  .t-btns button { padding: 6px 12px; font-size: 14px; }
  .t-btns .start { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .t-btns .start.paused { background: var(--ok); border-color: var(--ok); }

  .msg { max-width: 640px; margin: 48px auto; padding: 24px; background: var(--panel); border-top: 3px solid var(--accent); border-radius: 8px; line-height: 1.6; }
  .toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: #262626; color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .qr { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); padding: 16px; cursor: pointer; }
  .qr[hidden] { display: none; }
  .qr-card { background: #ffffff; color: #101010; border-top: 4px solid var(--accent); border-radius: 12px; padding: 24px; text-align: center; }
  .qr-code { width: min(80vw, 62vh, 480px); margin: 0 auto; }
  .qr-title { font-weight: 700; font-size: 20px; margin-bottom: 12px; }
  .qr-code svg { width: 100%; height: auto; display: block; }
  .qr-room { margin-top: 12px; font-size: 18px; color: #4a5565; }
  .qr-room b { color: #101010; letter-spacing: 2px; }
  .qr-hint { margin-top: 6px; font-size: 13px; color: #6a7282; }
</style>
</head>
<body>
<header>
  <img src="assets/hilegal-logo-white.png" alt="HiLegal">
  <span class="h-title">Presenter notes</span>
  <span class="room"><span class="dot" id="dot" title="Connection"></span>Room <code id="roomCode">…</code></span>
  <button class="h-btn" id="btnQr" type="button" aria-label="Show QR"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg><span class="lbl">Show QR</span></button>
  <button class="h-btn" id="btnShare" type="button" aria-label="Copy link for others"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span class="lbl">Copy link for others</span></button>
  <a class="h-btn proj" id="lnkProjector" target="_blank" rel="noopener" aria-label="Open on projector"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg><span class="lbl">Open on projector</span></a>
</header>
<main id="main">
  <div class="eyebrow" id="slideNo">Loading…</div>
  <h1 id="title"></h1>
  <div class="plan" id="plan"></div>
  <div class="notes" id="notes"></div>
  <div class="next" id="next"></div>
</main>
<footer>
  <button class="nav" id="btnPrev" type="button" aria-label="Previous slide"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="timer">
    <div class="clock" id="clock">00:00</div>
    <div class="clock-sub" id="clockSub">of 17:00</div>
    <div class="t-btns">
      <button class="start paused" id="btnTimer" type="button">Start</button>
      <button id="btnReset" type="button">Reset</button>
    </div>
  </div>
  <button class="nav" id="btnNext" type="button" aria-label="Next slide"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
</footer>
<div class="toast" id="toast"></div>
<div class="qr" id="qr" hidden>
  <div class="qr-card">
    <div class="qr-title">Scan to join the presenter notes</div>
    <div class="qr-code" id="qrCode"></div>
    <div class="qr-room">Room <b id="qrRoom"></b></div>
    <div class="qr-hint">Tap anywhere to close</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="runtime/sync.js?v=2"></script>
<script src="runtime/notes.js?v=1"></script>
<script>
(function () {
  'use strict';
  var BUDGET = 17 * 60 * 1000;
  var $ = function (id) { return document.getElementById(id); };
  var allSlides = [], slides = [], state = { slide: null, running: false, elapsed: 0, receivedAt: Date.now() }, link = null;
  // Show/hide overrides set with the eye buttons in the deck viewer, received through the room.
  var vis = null;

  function applyVisibility() {
    slides = allSlides.filter(function (s) {
      return !(vis && Object.prototype.hasOwnProperty.call(vis, s.id) ? vis[s.id] : s.fileHidden);
    });
  }

  var room = DeckSync.roomFromUrl();
  if (!room) {
    room = DeckSync.newRoom();
    history.replaceState(null, '', location.pathname + '?room=' + room);
  }
  $('roomCode').textContent = room;
  var base = location.href.replace(/[^/]*([?#].*)?$/, '');
  $('lnkProjector').href = base + 'index.html?present&room=' + room;

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  function fmt(ms) {
    var s = Math.floor(Math.abs(ms) / 1000);
    return (ms < 0 ? '-' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function planMs(notes) {
    var m = /TIME:\s*(\d+):(\d{2})/.exec(notes || '');
    return m ? (+m[1] * 60 + +m[2]) * 1000 : 0;
  }

  function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function formatNotes(t) {
    if (!t) return '<span style="color:#99a1af">(no notes)</span>';
    // Speaker and time are shown as chips above, so the first notes line is skipped.
    return DeckNotes.html(t.replace(/^SPEAKER:[^\n]*\n/, ''));
  }

  function loadDeck() {
    return fetch('deck.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (deck) {
      return Promise.all(deck.order.map(function (id) {
        return fetch('slides/' + id + '.html', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; });
      })).then(function (texts) {
        var out = [];
        deck.order.forEach(function (id, i) {
          var tpl = document.createElement('template');
          tpl.innerHTML = texts[i].trim();
          var sec = tpl.content.querySelector('section');
          if (!sec) return;
          var aside = sec.querySelector('aside'), h = sec.querySelector('h1, h2');
          if (h) h.querySelectorAll('br').forEach(function (b) { b.replaceWith(' '); });
          var notes = aside ? aside.textContent.trim() : '';
          var sp = /SPEAKER:s*([^.]+)./.exec(notes);
          out.push({ id: id, fileHidden: sec.hasAttribute('hidden'), speaker: sp ? sp[1].trim() : '', chapter: sec.getAttribute('data-chapter'), title: h ? h.textContent.replace(/\s+/g, ' ').trim() : id, notes: notes, plan: planMs(notes) });
        });
        return out;
      });
    });
  }

  function index() {
    var i = slides.findIndex(function (s) { return s.id === state.slide; });
    return i < 0 ? 0 : i;
  }

  function render() {
    if (!slides.length) return;
    var i = index(), s = slides[i];
    var numbered = slides.filter(function (x) { return !x.chapter; }), n = numbered.indexOf(s) + 1;
    $('slideNo').textContent = s.chapter ? 'Chapter ' + s.chapter : 'Slide ' + n + ' / ' + numbered.length;
    $('title').textContent = s.title;
    $('notes').innerHTML = formatNotes(s.notes);
    $('next').textContent = i + 1 < slides.length ? 'Next: ' + slides[i + 1].title : 'Last slide';
    $('btnPrev').disabled = i === 0;
    $('btnNext').disabled = i === slides.length - 1;
    if (render.last !== s.id) $('main').scrollTop = 0;
    render.last = s.id;
    renderTimer();
  }

  function renderTimer() {
    var el = DeckSync.elapsedOf(state);
    $('clock').textContent = fmt(el);
    $('clock').classList.toggle('over', el > BUDGET);
    $('clockSub').textContent = el > BUDGET ? fmt(el - BUDGET) + ' over 17:00' : fmt(BUDGET - el) + ' left of 17:00';
    $('btnTimer').textContent = state.running ? 'Pause' : (el > 0 ? 'Resume' : 'Start');
    $('btnTimer').classList.toggle('paused', !state.running);
    if (!slides.length) return;
    var i = index(), s = slides[i], before = 0;
    for (var k = 0; k < i; k++) before += slides[k].plan;
    var endPlan = before + s.plan, html = '';
    if (s.speaker) html += '<span class="chip">Speaker <b>' + escapeHtml(s.speaker) + '</b></span>';
    if (s.plan) html += '<span class="chip">Slide time <b>' + fmt(s.plan) + '</b></span>';
    if (s.plan) html += '<span class="chip">Planned end <b>' + fmt(endPlan) + '</b></span>';
    if (el > 0 && s.plan) {
      var diff = el - before;
      if (diff < -5000) html += '<span class="chip ahead">' + fmt(-diff) + ' ahead</span>';
      else if (el > endPlan + 5000) html += '<span class="chip behind">' + fmt(el - endPlan) + ' behind</span>';
      else html += '<span class="chip ahead">On time</span>';
    }
    var plan = $('plan');
    if (plan.innerHTML !== html) plan.innerHTML = html;
  }

  function publish(next) {
    next.receivedAt = Date.now();
    if (vis) next.vis = vis;
    state = next;
    render();
    if (link) link.send(next);
  }

  function go(delta) {
    var i = index() + delta;
    if (i < 0 || i >= slides.length) return;
    publish({ slide: slides[i].id, running: state.running, elapsed: DeckSync.elapsedOf(state) });
  }

  $('btnPrev').addEventListener('click', function () { go(-1); });
  $('btnNext').addEventListener('click', function () { go(1); });
  $('btnTimer').addEventListener('click', function () {
    publish({ slide: state.slide || slides[0].id, running: !state.running, elapsed: DeckSync.elapsedOf(state) });
    keepAwake();
  });
  $('btnReset').addEventListener('click', function () {
    if (!confirm('Reset the timer to 00:00 for everyone?')) return;
    publish({ slide: state.slide || slides[0].id, running: false, elapsed: 0 });
  });
  $('btnShare').addEventListener('click', function () {
    var url = base + 'presenter.html?room=' + room;
    if (navigator.share) navigator.share({ title: 'Presenter notes', url: url }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); });
  });
  $('btnQr').addEventListener('click', function () {
    if (!window.qrcode) { toast('QR not available offline, use Copy link'); return; }
    var q = qrcode(0, 'M');
    q.addData(base + 'presenter.html?room=' + room);
    q.make();
    $('qrCode').innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    $('qrRoom').textContent = room;
    $('qr').hidden = false;
  });
  $('qr').addEventListener('click', function () { $('qr').hidden = true; });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') $('qr').hidden = true;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
  });

  // Keeps phones from locking during the talk.
  var lock = null;
  function keepAwake() {
    if (!('wakeLock' in navigator) || lock) return;
    navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && state.running) keepAwake(); });

  if (location.protocol === 'file:') {
    $('main').innerHTML = '<div class="msg">Open this page through the web address, e.g. the GitHub Pages link, not from the folder.</div>';
    return;
  }

  loadDeck().then(function (list) {
    allSlides = list;
    applyVisibility();
    if (!state.slide) state.slide = slides[0].id;
    render();
    link = DeckSync.connect(room, function (st, own) {
      if (own) return;
      if (st.vis) { vis = st.vis; applyVisibility(); }
      state = st;
      render();
    }, function (on) { $('dot').classList.toggle('on', on); $('dot').title = on ? 'Connected' : 'Reconnecting…'; });
  }).catch(function (err) {
    $('main').innerHTML = '<div class="msg">Could not load the slides: ' + escapeHtml(err.message) + '</div>';
  });

  setInterval(renderTimer, 250);
})();
</script>
</body>
</html>
